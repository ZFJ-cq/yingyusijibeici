<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>"
    />
    <!-- viewport-fit=cover：让页面延伸到 iPhone 刘海/圆角区域，配合 env(safe-area-inset-*) 使用 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <!-- 移动端浏览器地址栏配色，初始值；切主题时由 JS 动态更新为对应色 -->
    <meta name="theme-color" content="#f4f7fb" />
    <!-- 添加到主屏后以独立 App 形式打开（无浏览器 UI）
         注意：新版 Chrome 已把 apple- 前缀标记为废弃，标准名是 mobile-web-app-capable，
         两个都写以兼容新老浏览器 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>四级遗忘曲线背单词</title>

    <!--
      在 Vue 挂载前先应用已保存的主题，避免暗色用户看到白色闪屏（FOUC）。
      这里只读 localStorage 里"已经保存过"的主题；没保存过就保持默认浅色，
      与 useStore 里的默认设置保持一致，避免出现「先暗后亮」的反向闪烁。
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('cet4_forgetting_curve_v1')
          var theme = raw ? (JSON.parse(raw).settings || {}).theme : ''
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.dataset.theme = theme
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', theme === 'dark' ? '#12161e' : '#f4f7fb')
          }
        } catch (e) {
          /* 解析失败就交给 Vue 用默认值处理 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
